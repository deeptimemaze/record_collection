<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl shelf</title>
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vinyl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3efe8;--card:#fffdf9;--ink:#23201c;--mute:#7a7268;--line:#ddd5c8;--wood:#c9a574;--wood-d:#a98450;--acc:#1f5f5b;--acc-ink:#fff;--hi:#f0b429}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#efe9df;--mute:#9a9185;--line:#37322c;--wood:#6e5636;--wood-d:#4f3d25;--acc:#5cb8b0;--acc-ink:#0d1f1e;--hi:#e0a21b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{-webkit-user-select:none;user-select:none;cursor:pointer}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Iowan Old Style",serif}
body{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:16px 0 8px;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
input[type=search],input[type=number],input[type=text],select{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:186px;min-height:58px;padding:14px 0;font-size:16px;background:none;border:0;color:var(--mute);font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.rec{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.rec .t{flex:1;min-width:0}.rec b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec span.s{color:var(--mute);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:600 13px/1.25 system-ui,sans-serif;padding:5px 9px;border-radius:7px;background:var(--acc);color:var(--acc-ink);text-align:right;flex:none;max-width:45%}
.tag.no{background:none;border:1px dashed var(--mute);color:var(--mute)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px;background:var(--wood);border-radius:6px;border:2px solid var(--wood-d);margin:10px 0}
.cell{aspect-ratio:1;background:var(--bg);border:0;border-radius:2px;box-shadow:inset 0 3px 8px rgba(0,0,0,.25);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.shelf.mini .cell{aspect-ratio:1.5}
.cell .n{font:700 22px system-ui,sans-serif}.cell .c{font:12px system-ui,sans-serif;color:var(--mute)}
.shelf.mini .n{font-size:16px}.shelf.mini .c{display:none}
.cell.hi{background:var(--hi);color:#23201c}.cell.hi .c{color:#23201c}
.cell.sel{outline:3px solid var(--acc);outline-offset:-3px}
.locname{font-weight:700;margin-top:10px}.shelf.one .cell{aspect-ratio:4/1}.shelf.one .n{display:none}.shelf.one .c{font-size:15px;color:var(--ink)}
.shelf.units{gap:4px;padding:6px}.shelf.units .n{font-size:13px}.shelf.units .c{font-size:10px}.shelf.mini.units .cell,.shelf.pick .cell{aspect-ratio:1}.shelf.pick .cell{min-height:36px}
.shelf.case{background:#d6a21c;border:5px solid #1c1c1c;border-radius:12px;padding:12px}.shelf.case .cell{background:#1c1c1c;color:#f3efe8;border-radius:4px}.shelf.case .c{color:#f3efe8}
.shelf .cell.ub{margin-bottom:9px}
.shelf.units.col1 .cell{aspect-ratio:auto;height:48px;flex-direction:row;gap:14px}.shelf.units.col1 .n{font-size:18px}.shelf.units.col1 .c{font-size:12px}
.shelf.units.col1.mini .cell{height:26px}.shelf.units.col1.mini .n{font-size:14px}.shelf.units.col1.pick .cell{height:40px}
.stick{position:sticky;top:env(safe-area-inset-top);z-index:3;background:var(--bg);padding:6px 0 2px;margin:0 -14px;padding-left:14px;padding-right:14px}
.shelf .cell{min-height:44px}.shelf.mini .cell{min-height:34px}
.mute{color:var(--mute);font-size:14px}.empty{text-align:center;color:var(--mute);padding:30px 10px}
.btn{min-height:50px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;width:100%;margin:6px 0}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.dng{color:#c0392b}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:10}
#sheet.open{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
.grid12{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 14px}
.grid12 button{min-height:50px;padding:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);font:600 17px system-ui,sans-serif}
.grid12 button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
label{display:block;font-weight:700;margin-top:8px}
label.ck{font-weight:400;display:flex;gap:10px;align-items:center;padding:8px 0}
label.ck input{width:20px;height:20px}
</style>
</head>
<body>
<h1 id="h"></h1>
<main id="app"></main>
<nav><button data-v="rec">Records</button><button data-v="shelf">Shelf</button><button data-v="data">Data</button></nav>
<div id="sheet"><div id="sheetbody"></div></div>

<script>
const DEFAULT_LOCS=[
 {id:'kallax',name:'Kallax shelf',mode:'grid',cols:3,rows:4,cap:0,formats:['lp']},
 {id:'case7',name:'7" case',mode:'grid',cols:1,rows:1,cap:200,formats:['s7']},
 {id:'string',name:'String Pocket',mode:'units',cols:1,stack:8,rows:3,cap:0,formats:['cd']}];
let locs=[],recs=[],view='rec',q='',onlyUnplaced=false,catF='all',selLoc=null,selSec=null,lim=100,staged=null,
    sel={lp:1,s7:1,cd:1,shellac:0,cass:0,other:0};
const CATS={lp:'LP, 12" and 10"',s7:'7"',shellac:'Shellac (78 rpm)',cd:'CD and MiniDisc',cass:'Cassette',other:'Other (boxes, etc.)'};
const SHORT={lp:'LP / 12"',s7:'7"',shellac:'Shellac',cd:'CD',cass:'Cassette',other:'Other'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/gi,'l').replace(/ø/gi,'o').replace(/æ/gi,'ae').replace(/ß/g,'ss').replace(/đ/gi,'d').toLowerCase();
function save(){try{localStorage.setItem('vinylRecs2',JSON.stringify(recs));localStorage.setItem('vinylLocs',JSON.stringify(locs))}catch(e){}}
function load(){
  try{recs=JSON.parse(localStorage.getItem('vinylRecs2')||'[]')}catch(e){recs=[]}
  try{locs=JSON.parse(localStorage.getItem('vinylLocs')||'null')}catch(e){locs=null}
  if(!Array.isArray(locs)||!locs.length)locs=JSON.parse(JSON.stringify(DEFAULT_LOCS));
  recs.forEach(prep);
  locs.forEach(l=>{if(l.id=='string'&&l.mode=='units'&&((l.cols==8&&!l.stack)||(l.cols==4&&l.stack==2))){l.cols=1;l.stack=8}});
}
function prep(r){r.k=fold(r.artist+' '+r.title);r.sk=fold(r.artist).replace(/^the /,'')+'|'+fold(r.title)}

/* locations */
const L=id=>locs.find(l=>l.id===id);
const stk=l=>l.mode=='units'?(l.stack||1):1;
const dRows=l=>l.rows*stk(l);
const nSlots=l=>l.cols*dRows(l);
const single=l=>nSlots(l)==1;
const placed=r=>!!(r.section&&L(r.loc));
const slotLabel=(l,n)=>single(l)?'':l.mode=='units'?`Shelf ${n}`:`Section ${n}`;
const slotShort=(l,n)=>single(l)?'':String(n);
const slotAt=(l,r,c)=>l.mode=='units'?c*dRows(l)+r+1:r*l.cols+c+1;
const inSlot=(id,n)=>recs.filter(r=>r.loc===id&&r.section===n).sort((a,b)=>a.pos-b.pos);
const defaultLoc=r=>locs.find(l=>(l.formats||[]).includes(r.cat))||locs[0];

function place(r,locId,sec,pos){
  const oL=r.loc,oS=r.section;r.loc=null;r.section=null;r.pos=null;
  if(oS)inSlot(oL,oS).forEach((x,i)=>x.pos=i+1);
  if(locId&&sec){
    const list=inSlot(locId,sec);
    const idx=Math.min(Math.max(pos||list.length+1,1),list.length+1)-1;
    list.splice(idx,0,r);
    list.forEach((x,i)=>{x.loc=locId;x.section=sec;x.pos=i+1});
  }
  save();
}
function renumberAll(){
  const g={};recs.filter(placed).forEach(r=>(g[r.loc+'|'+r.section]??=[]).push(r));
  Object.values(g).forEach(a=>a.sort((x,y)=>(x.pos||1e9)-(y.pos||1e9)).forEach((r,i)=>r.pos=i+1));
  recs.filter(r=>!placed(r)).forEach(r=>{r.loc=null;r.section=null;r.pos=null});
}

/* CSV */
async function readText(f){
  const buf=await f.arrayBuffer();let t;
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
  return t.replace(/^\uFEFF/,'').normalize('NFC');
}
function parseCSV(t){
  const first=t.split(/\r?\n/)[0]||'';
  const cnt=c=>first.split(c).length;
  const d=cnt(';')>cnt(',')?';':(cnt('\t')>cnt(',')?'\t':',');
  const rows=[];let row=[],f='',qt=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(qt){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else qt=false}else f+=c}
    else if(c=='"')qt=true;
    else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function catOf(fmt){
  const t=(fmt.split(',')[0]||'').trim().replace(/^\d+x/i,'').toLowerCase();
  if(/^(lp|12"|10")/.test(t))return'lp';
  if(t.startsWith('7"'))return's7';
  if(t.startsWith('shellac'))return'shellac';
  if(/^(cd|hdcd|md|sacd)/.test(t))return'cd';
  if(t.startsWith('cass'))return'cass';
  return'other';
}
function stage(text){
  const rows=parseCSV(text);if(!rows.length)return null;
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=(...res)=>{for(const re of res){const i=h.findIndex(x=>re.test(x));if(i>=0)return i}return -1};
  let ia=ix(/^artist$/,/artist|band|performer/),it=ix(/^(title|album|name)$/,/title|album|release name/),
      iy=ix(/^(released|year)$/,/year|released/),ifm=ix(/^format$/),ir=ix(/^release_id$/,/release.?id/),
      is=ix(/^section$/),ip=ix(/^pos(ition)?$/),il=ix(/^location$/),body=rows.slice(1);
  if(ia<0&&it<0){ia=0;it=1;body=rows}
  if(it<0)it=ia===0?1:0;
  const g=(r,i)=>i>=0?(r[i]||'').trim():'';
  const seen={},out=[];
  body.forEach((r,n)=>{
    const artist=g(r,ia).replace(/\s*\(\d+\)$/,''),title=g(r,it);
    if(!artist&&!title)return;
    const rid=g(r,ir)||('row'+n);seen[rid]=(seen[rid]||0)+1;
    const fmt=g(r,ifm),s=parseInt(g(r,is)),p=parseInt(g(r,ip)),lo=g(r,il);
    const ok=il>=0&&L(lo)&&s>=1;
    out.push({id:rid+'#'+seen[rid],artist,title,year:g(r,iy).replace(/^0$/,''),fmt,cat:ifm>=0?catOf(fmt):'lp',
      loc:ok?lo:null,section:ok?s:null,pos:ok&&p>0?p:null});
  });
  return out;
}
function finishImport(){
  const old=Object.fromEntries(recs.map(r=>[r.id,r]));
  const pick=staged.filter(r=>sel[r.cat]);
  pick.forEach(r=>{const o=old[r.id];if(o&&placed(o)){r.loc=o.loc;r.section=o.section;r.pos=o.pos}});
  const keep=new Set(pick.map(r=>r.id));
  const lost=recs.filter(r=>placed(r)&&!keep.has(r.id)).length;
  recs=pick;recs.forEach(prep);renumberAll();save();staged=null;
  return `Imported ${recs.length} records, ${recs.filter(placed).length} placed.`+(lost?` ${lost} placed records were not in the new import and have been dropped.`:'');
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=['Artist,Title,Released,Format,release_id,location,section,position',
    ...recs.map(r=>[r.artist,r.title,r.year,r.fmt,r.id.split('#')[0],placed(r)?r.loc:'',placed(r)?r.section:'',placed(r)?r.pos:''].map(q).join(','))];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='vinyl-collection.csv';document.body.appendChild(a);a.click();a.remove();
}

/* UI pieces */
function shelfHTML(l,hi=new Set(),mini=false,selN=null){
  let h=`<div class="shelf${mini?' mini':''}${l.mode=='units'?' units':''}${l.mode=='units'&&l.cols==1?' col1':''}${single(l)?' one':''}${l.id=='case7'?' case':''}" style="grid-template-columns:repeat(${l.cols},1fr)">`;
  for(let r=0;r<dRows(l);r++)for(let c=0;c<l.cols;c++){
    const n=slotAt(l,r,c),k=inSlot(l.id,n).length;
    h+=`<button class="cell${hi.has(n)?' hi':''}${selN===n?' sel':''}${l.mode=='units'&&(r+1)%l.rows==0&&r<dRows(l)-1?' ub':''}" data-loc="${esc(l.id)}" data-sec="${n}"><span class="n">${slotShort(l,n)}</span><span class="c">${k}${l.cap?' / '+l.cap:''}</span></button>`;
  }
  return h+'</div>';
}
function meta(r){const f=(r.fmt||'').split(',')[0].trim();return [r.year,f].filter(Boolean).join(' · ')}
function tagHTML(r){
  if(!placed(r))return '<span class="tag no">Not placed</span>';
  const l=L(r.loc),sl=slotLabel(l,r.section);
  return `<span class="tag">${esc(l.name)}<br>${sl?esc(sl)+' · ':''}#${r.pos}</span>`;
}
function recHTML(r){
  return `<button class="rec" data-id="${esc(r.id)}"><div class="t"><b>${esc(r.artist)}</b><span class="s">${esc(r.title)}</span><span class="s">${esc(meta(r))}</span></div>${tagHTML(r)}</button>`;
}
function matches(){
  const w=fold(q).split(/\s+/).filter(Boolean);
  return recs.filter(r=>(!onlyUnplaced||!placed(r))&&(catF=='all'||r.cat==catF)&&w.every(x=>r.k.includes(x))).sort((a,b)=>a.sk<b.sk?-1:a.sk>b.sk?1:0);
}
function fillList(){
  const m=matches();let mini='';
  if(q.trim()&&m.length)locs.forEach(l=>{
    const s=new Set(m.filter(r=>placed(r)&&r.loc==l.id).map(r=>r.section));
    if(s.size)mini+=`<div class="locname">${esc(l.name)}</div>`+shelfHTML(l,s,true);
  });
  $('#mini').innerHTML=mini;
  $('#list').innerHTML=!recs.length?'<div class="empty">No records yet.<br>Open the Data tab to import your CSV.</div>':
    !m.length?'<div class="empty">No matches.</div>':
    `<p class="mute">${m.length} record${m.length==1?'':'s'}</p>`+m.slice(0,lim).map(recHTML).join('')+(m.length>lim?`<button class="btn" data-more="1">Show more</button>`:'');
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
  const app=$('#app');
  if(view=='rec'){
    $('#h').textContent='Records';
    const np=recs.filter(r=>!placed(r)).length;
    const cats=Object.keys(SHORT).filter(k=>recs.some(r=>r.cat==k));
    app.innerHTML=`<div class="stick"><input type="search" id="q" placeholder="Search artist or title" value="${esc(q)}" autocomplete="off" autocapitalize="off" enterkeyhint="search">
    <div class="chips"><button class="chip${onlyUnplaced?'':' on'}" data-f="all">All ${recs.length}</button><button class="chip${onlyUnplaced?' on':''}" data-f="un">Not placed ${np}</button></div>
    ${cats.length>1?`<div class="chips"><button class="chip${catF=='all'?' on':''}" data-c="all">Any format</button>${cats.map(k=>`<button class="chip${catF==k?' on':''}" data-c="${k}">${SHORT[k]}</button>`).join('')}</div>`:''}</div>
    <div id="mini"></div><div id="list"></div>`;
    fillList();
    $('#q').oninput=e=>{q=e.target.value;lim=100;fillList()};
    $('#q').onkeydown=e=>{if(e.key=='Enter')e.target.blur()};
  }else if(view=='shelf'){
    $('#h').textContent='Shelf';
    if(!L(selLoc))selLoc=locs[0]?.id;
    const l=L(selLoc);let h='';
    if(locs.length>1)h+=`<div class="chips">${locs.map(x=>`<button class="chip${x.id==selLoc?' on':''}" data-l="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`;
    if(l){
      if(single(l))selSec=1;
      h+=shelfHTML(l,new Set(),false,selSec);
      if(selSec){const a=inSlot(l.id,selSec);
        h+=`<p class="mute">${esc(single(l)?l.name:slotLabel(l,selSec))}${single(l)?'':', left to right'}: ${a.length}${l.cap?' of '+l.cap:''} records</p>`+
        (a.length?a.map(r=>`<button class="rec" data-id="${esc(r.id)}"><span class="tag">#${r.pos}</span><div class="t"><b>${esc(r.artist)}</b><span class="s">${esc(r.title)}</span><span class="s">${esc(meta(r))}</span></div></button>`).join(''):'<div class="empty">Nothing here yet.</div>');
      }else h+=l.mode=='units'?`<p class="mute">Shelves are numbered from the top, ${l.rows} per unit. Tap a shelf to see its records.</p>`:
        '<p class="mute">Sections are numbered along each row, starting at the top left. Tap a section to see its records.</p>';
    }else h='<div class="empty">No storage locations. Add one in the Data tab.</div>';
    app.innerHTML=h;
  }else dataView();
}
function dataView(msg=''){
  $('#h').textContent='Data';
  let h=`<p class="mute">${recs.length} records · ${recs.filter(placed).length} placed</p>`;
  if(staged){
    const c={};staged.forEach(r=>c[r.cat]=(c[r.cat]||0)+1);
    const n=staged.filter(r=>sel[r.cat]).length;
    h+=`<label>What should be imported?</label><p class="mute">Found ${staged.length} rows. Pick the formats you want to keep track of.</p>`+
      Object.keys(CATS).filter(k=>c[k]).map(k=>`<label class="ck"><input type="checkbox" data-cat="${k}" ${sel[k]?'checked':''}> ${CATS[k]} <span class="mute">(${c[k]})</span></label>`).join('')+
      `<button class="btn pri" id="go">Import ${n} records</button><button class="btn" id="no">Cancel</button><p class="mute">Records that match an earlier import keep their location.</p>`;
  }else h+=`<label>Storage locations</label>`+
    locs.map(l=>`<button class="rec" data-el="${esc(l.id)}"><div class="t"><b>${esc(l.name)}</b><span class="s">${single(l)?'One compartment':l.mode=='units'?`${l.cols*stk(l)} units, ${l.rows} shelves each`:`${l.cols} × ${l.rows} sections`}${l.cap?`, ${l.cap} per ${single(l)?'case':'slot'}`:''}</span></div><span class="tag no">Edit</span></button>`).join('')+
    `<button class="btn" id="addloc">Add storage location</button>
    <label>Import collection (CSV)</label><p class="mute">Works with your Discogs export. Placed records keep their location when you import again.</p>
    <input type="file" id="file" accept=".csv,text/csv,text/plain" hidden><button class="btn pri" id="imp">Choose CSV file</button>
    <label>Back up</label><p class="mute">Export a CSV that includes where every record sits. You can import it again later.</p>
    <button class="btn" id="exp">Export CSV</button><button class="btn dng" id="clr">Clear all records</button>`;
  $('#app').innerHTML=h+`<p class="mute" id="msg">${esc(msg)}</p>`;
  if(staged){
    document.querySelectorAll('[data-cat]').forEach(i=>i.onchange=()=>{sel[i.dataset.cat]=i.checked?1:0;dataView()});
    $('#go').onclick=()=>{const m=finishImport();dataView(m)};
    $('#no').onclick=()=>{staged=null;dataView()};
  }else{
    $('#imp').onclick=()=>$('#file').click();
    $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
      const r=stage(await readText(f));
      if(!r||!r.length)return dataView('No records found. Check that the file has artist and title columns.');
      staged=r;dataView()};
    $('#exp').onclick=exportCSV;
    $('#addloc').onclick=()=>locSheet(null);
    $('#clr').onclick=()=>{if(confirm('Delete all records and placements?')){recs=[];save();render()}};
  }
}

/* sheets */
function openRecSheet(id){
  const r=recs.find(x=>x.id==id);if(!r)return;
  let lid=placed(r)?r.loc:defaultLoc(r)?.id,sec=placed(r)?r.section:null;
  const body=$('#sheetbody');
  const draw=()=>{
    const l=L(lid);if(!l){body.innerHTML='<p>Add a storage location in the Data tab first.</p><button class="btn" id="cx">Close</button>';$('#cx').onclick=closeSheet;return}
    if(single(l))sec=1;
    const n=sec?inSlot(l.id,sec).filter(x=>x.id!=r.id).length:0;
    let slots='';
    if(!single(l)){
      slots=`<label>${l.mode=='units'?'Shelf':'Section'}</label><div class="shelf pick${l.mode=='units'?' units':''}${l.mode=='units'&&l.cols==1?' col1':''}" style="grid-template-columns:repeat(${l.cols},1fr)">`;
      for(let rr=0;rr<dRows(l);rr++)for(let c=0;c<l.cols;c++){const k=slotAt(l,rr,c);slots+=`<button data-s="${k}" class="cell${sec==k?' sel hi':''}${l.mode=='units'&&(rr+1)%l.rows==0&&rr<dRows(l)-1?' ub':''}"><span class="n">${slotShort(l,k)}</span></button>`}
      slots+='</div>';
    }
    body.innerHTML=`<b style="font-size:19px">${esc(r.artist)}</b><div class="mute">${esc(r.title)}</div><div class="mute">${esc(meta(r))}</div>
    ${locs.length>1?`<label>Location</label><div class="chips">${locs.map(x=>`<button class="chip${x.id==lid?' on':''}" data-pl="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`:''}
    ${slots}
    ${sec?`<label>Position${single(l)?'':' in '+esc(slotLabel(l,sec))}</label><input type="number" id="pos" min="1" max="${n+1}" inputmode="numeric" value="${placed(r)&&r.loc==lid&&r.section==sec?r.pos:n+1}">
    <p class="mute">Holds ${n} other record${n==1?'':'s'}${l.cap?` of ${l.cap}`:''}. Records at or after this position shift one place along.${l.cap&&n>=l.cap?' This one is already full.':''}</p>`:''}
    <button class="btn pri" id="ok">${sec?'Save location':'Save as not placed'}</button>
    ${placed(r)?'<button class="btn dng" id="rm">Remove from storage</button>':''}<button class="btn" id="cx">Cancel</button>`;
    body.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{lid=b.dataset.pl;sec=null;draw()});
    body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sec=sec==+b.dataset.s?null:+b.dataset.s;draw()});
    $('#cx').onclick=closeSheet;
    $('#ok').onclick=()=>{place(r,sec?lid:null,sec,sec?parseInt($('#pos').value)||null:null);closeSheet();render()};
    if($('#rm'))$('#rm').onclick=()=>{place(r,null,null);closeSheet();render()};
  };
  draw();showSheet();
}
function locSheet(id){
  const o=id?L(id):null;
  const l=o?{...o,formats:[...(o.formats||[])]}:{id:'l'+Date.now().toString(36),name:'',mode:'grid',cols:3,rows:4,cap:0,formats:[]};
  const body=$('#sheetbody');
  body.innerHTML=`<b style="font-size:19px">${o?'Edit storage location':'New storage location'}</b>
  <label>Name</label><input type="text" id="ln" value="${esc(l.name)}" placeholder="e.g. Hallway shelf">
  <label>Layout</label><select id="lm"><option value="grid" ${l.mode=='grid'?'selected':''}>Grid of sections (like a Kallax)</option><option value="units" ${l.mode=='units'?'selected':''}>Units with shelves (like String Pocket)</option></select>
  <label id="lc">Columns</label><input type="number" id="lcols" min="1" max="12" value="${l.cols}" inputmode="numeric">
  <div id="lsw"><label>Units stacked above each other</label><input type="number" id="lstack" min="1" max="6" value="${l.stack||1}" inputmode="numeric"></div>
  <label id="lr">Rows</label><input type="number" id="lrows" min="1" max="12" value="${l.rows}" inputmode="numeric">
  <label>Capacity per section (0 for no limit)</label><input type="number" id="lcap" min="0" value="${l.cap||0}" inputmode="numeric">
  <label>Usually holds</label>${Object.keys(CATS).map(k=>`<label class="ck"><input type="checkbox" data-lf="${k}" ${l.formats.includes(k)?'checked':''}> ${CATS[k]}</label>`).join('')}
  <button class="btn pri" id="ok">Save</button>${o?'<button class="btn dng" id="del">Delete location</button>':''}<button class="btn" id="cx">Cancel</button>`;
  const lab=()=>{const u=$('#lm').value=='units';$('#lc').textContent=u?'Columns of units':'Columns of sections';$('#lr').textContent=u?'Shelves per unit':'Rows of sections';$('#lsw').style.display=u?'':'none'};
  lab();$('#lm').onchange=lab;$('#cx').onclick=closeSheet;
  $('#ok').onclick=()=>{
    const n={id:l.id,name:$('#ln').value.trim()||'Storage',mode:$('#lm').value,cols:Math.max(1,Math.min(12,parseInt($('#lcols').value)||1)),
      rows:Math.max(1,Math.min(12,parseInt($('#lrows').value)||1)),stack:$('#lm').value=='units'?Math.max(1,Math.min(6,parseInt($('#lstack').value)||1)):1,cap:Math.max(0,parseInt($('#lcap').value)||0),
      formats:[...body.querySelectorAll('[data-lf]:checked')].map(i=>i.dataset.lf)};
    const total=nSlots(n),out=recs.filter(r=>r.loc===n.id&&r.section>total);
    if(out.length&&!confirm(`${out.length} placed records sit in sections that no longer exist. They will become not placed. Continue?`))return;
    if(o)locs[locs.indexOf(o)]=n;else locs.push(n);
    out.forEach(r=>{r.loc=null;r.section=null;r.pos=null});
    save();closeSheet();render();
  };
  if($('#del'))$('#del').onclick=()=>{
    const k=recs.filter(r=>r.loc===l.id&&r.section).length;
    if(!confirm(`Delete ${o.name}?${k?` ${k} placed records will become not placed.`:''}`))return;
    recs.forEach(r=>{if(r.loc===l.id){r.loc=null;r.section=null;r.pos=null}});
    locs=locs.filter(x=>x.id!==l.id);save();closeSheet();render();
  };
  showSheet();
}
let sheetOpen=false;
function showSheet(){$('#sheet').classList.add('open');if(!sheetOpen)try{history.pushState({sheet:1},'')}catch(e){}sheetOpen=true}
function closeSheet(){if(!sheetOpen)return;sheetOpen=false;$('#sheet').classList.remove('open');try{if(history.state&&history.state.sheet)history.back()}catch(e){}}
window.addEventListener('popstate',()=>{if(sheetOpen){sheetOpen=false;$('#sheet').classList.remove('open')}});
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.v){view=d.v;render();window.scrollTo(0,0)}
  else if(d.f){onlyUnplaced=d.f=='un';lim=100;render()}
  else if(d.c){catF=d.c;lim=100;render()}
  else if(d.l){selLoc=d.l;selSec=null;render()}
  else if(d.more){lim+=100;fillList()}
  else if(d.sec&&view=='shelf'){const n=+d.sec;selSec=selSec==n?null:n;render()}
  else if(d.el){locSheet(d.el)}
  else if(d.id){openRecSheet(d.id)}
});
load();render();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
